<canvas id="c" width="1080" height="1080"></canvas>
<script>
const cv=document.getElementById('c'), x=cv.getContext('2d');
const W=1080,H=1080;
const P1='~/purse', P2='~/grain';
const S=[
 // ---- ACT 1 · the problem (VO n1 @1.0) ----
 {k:'cmt',s:'# Every coding agent I use is brilliant — and amnesiac.',d:3.2,p:P1,at:1.0},
 {k:'cmt',s:'# I correct it. It fixes. We go back and forth.',d:3.0,p:P1},
 {k:'cmt',s:'# Then the pull request merges…',d:2.6,p:P1},
 {k:'cmd',s:'git log --oneline -1',d:1.3,p:P1},
 {k:'out',d:1.6,L:[['11679e1  Add roundToNearest: round cents to nearest step','dim']]},
 {k:'cmt',s:'# …and the conversation that produced it is gone.',d:3.4,p:P1},
 {k:'cmt',s:'# All that survives is the diff.',d:2.6,p:P1},

 // ---- ACT 2 · what Entire is solving (VO n2 @19.29) ----
 {k:'cmt',s:'# Entire is going after exactly that:',d:2.8,p:P1,at:19.29},
 {k:'out',d:6.0,L:[['',''],['  "Every agent session stored in your repo."','a'],['  "Checkpoint for every commit."','a'],['  "Context that is attached, not archived."','a'],['',''],['  — entire.io','dim']]},

 // ---- ACT 3 · waitlist → access (VO n3 @31.83) ----
 {k:'cmt',s:'# Jul 9  — joined the waitlist.',d:2.6,p:P1,at:31.83},
 {k:'cmt',s:'# Jul 15 — "You are in. Let the rebellion begin."',d:3.6,p:P1},
 {k:'cmd',s:'entire login',d:1.3,p:P1},
 {k:'out',d:2.6,L:[['  Logging in to: https://us.auth.entire.io','dim'],['  Waiting for sign-in... ✓ Login complete.','g']]},

 // ---- ACT 4 · before state (VO n4 @43.90) ----
 {k:'cmd',s:'entire status',d:1.2,p:P1,at:43.90},
 {k:'out',d:1.6,L:[['● Enabled · manual-commit · branch main','g'],['  Agents · Claude Code','dim']]},
 {k:'cmt',s:'# Before we start: who wrote this file?',d:2.6,p:P1},
 {k:'cmd',s:'entire why src/money.js',d:1.3,p:P1},
 {k:'out',d:1.6,L:[['  288 lines · 0% AI (0) · 100% human (288)','dim']]},

 // ---- ACT 5 · agent works, checkpoint lands (VO n5 @52.95) ----
 {k:'cmd',s:'claude',d:1.0,p:P1,at:52.95},
 {k:'out',d:1.8,L:[['  Entire CLI will link this conversation to your next commit.','a']]},
 {k:'out',d:2.6,L:[['> Add roundToNearest(cents, step) following AGENTS.md,','w'],['  with table-driven tests. Run npm test, then commit.','w']]},
 {k:'out',d:3.0,L:[['  · wrote  src/money.js','dim'],['  · npm test → 96 pass, 0 fail','g'],['  · commit 11679e1','g']]},
 {k:'cmd',s:'entire checkpoint list',d:1.4,p:P1},
 {k:'out',d:3.2,L:[['  checkpoints  1','dim'],['',''],['● 138e19befa1b  "Add a roundToNearest(cents, step)…"','a'],['  07-27 18:30 (11679e1)','fg']]},

 // ---- ACT 6 · the discovery (VO n6 @66.51) ----
 {k:'cmt',s:'# Same question again.',d:2.2,p:P1,at:66.51},
 {k:'cmd',s:'entire why src/money.js',d:1.4,p:P1},
 {k:'out',d:4.0,L:[['  src/money.js','fg'],['  309 lines · 7% AI (21) · 93% human (288)','a'],['',''],['  - 138e19befa1b  21 lines · Claude Code · ffb9b780','dim']]},
 {k:'cmt',s:'# Every AI line traces back to the prompt that wrote it.',d:3.6,p:P1},
 {k:'cmt',s:'# An audit trail I have never had before.',d:3.0,p:P1},

 // ---- ACT 7 · what I built (VO n7 @81.09) ----
 {k:'cmt',s:'# So here is what I built on top of it.',d:3.0,p:P1,at:81.09},
 {k:'cmd',s:'cd ../grain',d:1.2,p:P1},
 {k:'cmt',s:'# grain reads those captured sessions.',d:2.8,p:P2},

 // ---- ACT 8 · grain scan (VO n8 @89.58) ----
 {k:'cmd',s:'grain scan --entire ../purse',d:1.6,p:P2,at:89.58},
 {k:'out',d:6.0,L:[['# Repo brief — distilled by Grain','w'],['',''],['From 1 session(s). Provenance: 1 Entire checkpoint.','dim'],['',''],['## How this repo is tested','a'],['- npm test  ·  1×','fg'],['',''],['## House conventions (from the code the agent wrote)','a'],['- Error handling: result-return — e.g. return err(…)','fg'],['- Quote style: single','fg'],['- Indentation: 2-space','fg']]},
 {k:'cmt',s:'# Nobody wrote that down. It learned it by watching.',d:3.6,p:P2},

 // ---- ACT 9 · proposed AGENTS.md (VO n9 @104.21) ----
 {k:'cmd',s:'grain agents --entire ../purse',d:1.6,p:P2,at:104.21},
 {k:'out',d:4.4,L:[['# AGENTS.md — proposed by Grain','w'],['',''],['## Conventions','a'],['- Return a Result; do not throw.','fg'],['- Use single quotes.','fg'],['- Indent with 2 spaces.','fg']]},
 {k:'cmt',s:'# The file the next agent reads before it writes a line.',d:3.6,p:P2},

 // ---- ACT 10 · audit, close, thanks (VO n10 @114.74) ----
 {k:'cmd',s:'grain audit --entire ../purse',d:1.6,p:P2,at:114.74},
 {k:'out',d:3.4,L:[['# Provenance audit — who/what produced this repo','w'],['',''],['| File               | Edits | Sessions | Commit  |','dim'],['| src/money.js       |   1   |    1     | 11679e1 |','fg']]},
 {k:'cmt',s:'# Sessions stop being exhaust. They become context.',d:3.4,p:P2},
 {k:'cmt',s:'# Thanks to the Entire team for building something different.',d:4.2,p:P2},
 {k:'out',d:3.4,L:[['',''],['  grain 🌾   github.com/abhid1234/grain','a'],['  built on Entire · entire.io','dim']]},
];

let acc=0.7; const T=S.map(e=>{if(e.at!==undefined)acc=e.at; const st=acc; acc+=e.d; return {...e,st,en:acc};});
const DUR=136.0;

// ---- themed renderer: phosphor CRT + matrix rain + chapter HUD ----
const MONO='Menlo,Monaco,"SF Mono",ui-monospace,monospace';
// phosphor palette (green primary, Entire amber accent)
const FG='#c8f5d8', DIM='#5f8a72', CMT='#79ad91';
const GREEN='#5bf59a', AMBER='#ffc453', BLUE='#7fd4ff', RED='#ff7a7a', WHITE='#eafff2', PUR='#c9a6ff';
const C={fg:FG,dim:DIM,cmt:CMT,g:GREEN,a:AMBER,b:BLUE,r:RED,w:WHITE,p:PUR};

const FS=23, LH=34;
const PADX=46, PADY=100;
const WINX=34, WINY=34, WINW=W-68, WINH=H-68;
const HUDH=44;                                   // bottom status bar
const MAXLINES=Math.floor((WINH-PADY-HUDH-26)/LH);

const ACTS=[[1.0,'01 · THE PROBLEM'],[19.29,'02 · WHAT ENTIRE FIXES'],[31.83,'03 · ACCESS GRANTED'],
 [43.90,'04 · BASELINE'],[52.95,'05 · THE SESSION'],[66.51,'06 · THE DISCOVERY'],
 [81.09,'07 · WHAT I BUILT'],[89.58,'08 · IT LEARNS THE REPO'],[104.21,'09 · THE RULES FILE'],[114.74,'10 · THE LOOP']];

function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
// deterministic PRNG so every frame is reproducible under seek()
function rnd(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const GLYPHS='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎ0123456789<>/\\|=+*#$%&';
const COLW=24, NCOL=Math.ceil(W/COLW);
const COLS=(()=>{const r=rnd(20260727);return Array.from({length:NCOL},()=>({sp:34+r()*92,off:r()*H*2,len:8+Math.floor(r()*16),s:Math.floor(r()*1e6)}));})();

function matrixRain(t){
  x.save();x.font=`500 18px ${MONO}`;x.textAlign='center';
  for(let c=0;c<NCOL;c++){
    const col=COLS[c], cx=c*COLW+COLW/2;
    const head=((t*col.sp+col.off)%(H+col.len*20))-col.len*10;
    for(let k=0;k<col.len;k++){
      const yy=head-k*20;
      if(yy<-20||yy>H+20) continue;
      const a=(1-k/col.len)*0.16;
      if(a<=0.005) continue;
      const gi=(col.s+k*31+Math.floor(t*7)*17)%GLYPHS.length;
      x.fillStyle=k===0?`rgba(180,255,215,${a*2.1})`:`rgba(70,200,130,${a})`;
      x.fillText(GLYPHS[gi],cx,yy);
    }
  }
  x.restore();
}

function backdrop(t){
  let g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#03080b');g.addColorStop(0.5,'#020609');g.addColorStop(1,'#010405');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  matrixRain(t);
  // ambient glows
  g=x.createRadialGradient(W*0.5,H*0.42,0,W*0.5,H*0.42,760);
  g.addColorStop(0,'rgba(40,180,110,0.10)');g.addColorStop(1,'rgba(40,180,110,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(W*0.86,H*0.06,0,W*0.86,H*0.06,540);
  g.addColorStop(0,'rgba(255,196,83,0.10)');g.addColorStop(1,'rgba(255,196,83,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
}

function windowChrome(title,t){
  x.save();
  x.shadowColor='rgba(0,0,0,0.75)';x.shadowBlur=70;x.shadowOffsetY=24;
  rr(WINX,WINY,WINW,WINH,18);x.fillStyle='rgba(4,10,8,0.90)';x.fill();   // rain shows faintly through
  x.shadowColor='transparent';
  rr(WINX,WINY,WINW,WINH,18);x.lineWidth=1.5;x.strokeStyle='rgba(91,245,154,0.28)';x.stroke();
  // title bar
  x.save();rr(WINX,WINY,WINW,54,18);x.clip();
  x.fillStyle='rgba(91,245,154,0.06)';x.fillRect(WINX,WINY,WINW,54);x.restore();
  x.beginPath();x.moveTo(WINX,WINY+54);x.lineTo(WINX+WINW,WINY+54);
  x.strokeStyle='rgba(91,245,154,0.20)';x.lineWidth=1;x.stroke();
  for(const [c,i] of [['#ff5f57',0],['#febc2e',1],['#28c840',2]]){x.beginPath();x.arc(WINX+30+i*24,WINY+27,7,0,7);x.fillStyle=c;x.fill();}
  x.font=`500 19px ${MONO}`;x.fillStyle=DIM;x.textAlign='center';
  x.shadowColor='rgba(91,245,154,0.5)';x.shadowBlur=8;
  x.fillText(title,WINX+WINW/2,WINY+34);
  x.restore();
}

function hud(t){
  let label='', idx=0;
  ACTS.forEach(([st,l],i)=>{if(t>=st){label=l;idx=i+1;}});
  if(!label) return;
  const by=WINY+WINH-HUDH;
  x.save();
  x.beginPath();x.moveTo(WINX+1,by);x.lineTo(WINX+WINW-1,by);
  x.strokeStyle='rgba(91,245,154,0.18)';x.lineWidth=1;x.stroke();
  x.fillStyle='rgba(91,245,154,0.045)';x.fillRect(WINX+1,by,WINW-2,HUDH-1);
  x.font=`700 16px ${MONO}`;x.textAlign='left';x.fillStyle=AMBER;
  x.shadowColor='rgba(255,196,83,0.55)';x.shadowBlur=8;
  x.fillText(label,WINX+PADX-16,by+28);
  x.shadowColor='transparent';
  x.font=`500 15px ${MONO}`;x.textAlign='right';x.fillStyle=DIM;
  x.fillText('grain 🌾 × entire',WINX+WINW-30,by+28);
  // progress bar
  const pw=WINW-2, p=Math.min(1,t/DUR);
  x.fillStyle='rgba(91,245,154,0.14)';x.fillRect(WINX+1,by+HUDH-4,pw,3);
  x.fillStyle='rgba(91,245,154,0.75)';x.fillRect(WINX+1,by+HUDH-4,pw*p,3);
  x.restore();
}

// scanlines + vignette + phosphor bloom overlay
function crt(t){
  x.save();
  x.globalAlpha=1;
  x.fillStyle='rgba(0,0,0,0.20)';
  for(let y=0;y<H;y+=3) x.fillRect(0,y,W,1);
  // rolling bright band (very subtle)
  const band=((t*46)%(H+240))-120;
  const g=x.createLinearGradient(0,band-60,0,band+60);
  g.addColorStop(0,'rgba(120,255,190,0)');g.addColorStop(0.5,'rgba(120,255,190,0.030)');g.addColorStop(1,'rgba(120,255,190,0)');
  x.fillStyle=g;x.fillRect(0,band-60,W,120);
  // vignette
  const v=x.createRadialGradient(W/2,H/2,H*0.30,W/2,H/2,H*0.80);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.62)');
  x.fillStyle=v;x.fillRect(0,0,W,H);
  x.restore();
}

// power-on sweep for the first moment
function powerOn(t){
  if(t>1.0) return;
  const p=Math.min(1,t/1.0);
  x.save();
  x.globalAlpha=(1-p)*0.9;
  x.fillStyle='#000';x.fillRect(0,0,W,H);
  const yy=H*0.5;
  const h=Math.max(2,(1-p)*H*0.5);
  const g=x.createLinearGradient(0,yy-h,0,yy+h);
  g.addColorStop(0,'rgba(91,245,154,0)');g.addColorStop(0.5,`rgba(180,255,215,${0.5*(1-p)})`);g.addColorStop(1,'rgba(91,245,154,0)');
  x.fillStyle=g;x.fillRect(0,yy-h,W,h*2);
  x.restore();
}

function linesAt(t){
  const out=[];
  for(const e of T){
    if(t>=e.en){
      if(e.k==='cmd') out.push({t:e.s,c:'w',prompt:e.p});
      else if(e.k==='cmt') out.push({t:e.s,c:'cmt'});
      else for(const [s,c] of e.L) out.push({t:s,c:c||'fg'});
      continue;
    }
    if(t<e.st) break;
    const p=(t-e.st)/e.d;
    if(e.k==='cmd'||e.k==='cmt'){
      const n=Math.min(e.s.length,Math.floor(p/0.78*e.s.length));
      out.push({t:e.s.slice(0,n),c:e.k==='cmd'?'w':'cmt',prompt:e.k==='cmd'?e.p:undefined,cur:true});
    } else {
      const n=Math.min(e.L.length,Math.floor(p/0.85*e.L.length)+1);
      for(let i=0;i<n;i++){const [s,c]=e.L[i];out.push({t:s,c:c||'fg'});}
    }
    break;
  }
  return out;
}

function draw(t){
  backdrop(t);
  const cwd=(()=>{let p=P1;for(const e of T){if(t>=e.st&&e.p)p=e.p;}return p;})();
  windowChrome(cwd+' — zsh',t);

  const all=linesAt(t);
  const vis=all.slice(Math.max(0,all.length-MAXLINES));
  x.save();
  rr(WINX+1,WINY+55,WINW-2,WINH-56-HUDH,18);x.clip();
  let yy=WINY+PADY;
  x.textAlign='left';x.textBaseline='alphabetic';
  for(const L of vis){
    let px=WINX+PADX;
    const bright=(L.c==='a'||L.c==='g'||L.c==='w');
    if(L.prompt!==undefined){
      x.font=`700 ${FS}px ${MONO}`;
      x.shadowColor='rgba(127,212,255,0.55)';x.shadowBlur=8;
      x.fillStyle=BLUE;x.fillText(L.prompt,px,yy);px+=x.measureText(L.prompt).width;
      x.shadowColor='rgba(91,245,154,0.6)';
      x.fillStyle=GREEN;x.fillText(' ❯ ',px,yy);px+=x.measureText(' ❯ ').width;
    }
    x.font=`${L.c==='w'?700:500} ${FS}px ${MONO}`;
    x.fillStyle=C[L.c]||FG;
    x.shadowColor=bright?(C[L.c]||FG).replace(')',',0.55)').replace('#','rgba(')
      :'rgba(120,220,170,0.22)';
    // simple bloom: use a fixed rgba glow per class
    x.shadowColor = L.c==='a'?'rgba(255,196,83,0.55)': L.c==='g'?'rgba(91,245,154,0.55)'
      : L.c==='w'?'rgba(234,255,242,0.45)': L.c==='r'?'rgba(255,122,122,0.5)'
      : L.c==='b'?'rgba(127,212,255,0.5)':'rgba(120,220,170,0.20)';
    x.shadowBlur=bright?10:5;
    x.fillText(L.t,px,yy);
    x.shadowBlur=0;x.shadowColor='transparent';
    if(L.cur){
      const w=x.measureText(L.t).width;
      if(Math.floor(t*2.2)%2===0){
        x.save();x.shadowColor='rgba(91,245,154,0.9)';x.shadowBlur=14;
        x.fillStyle='rgba(150,255,200,0.95)';x.fillRect(px+w+3,yy-FS+5,12,FS+2);x.restore();
      }
    }
    yy+=LH;
  }
  const last=vis[vis.length-1];
  if(last&&!last.cur&&Math.floor(t*2.2)%2===0){
    x.save();x.shadowColor='rgba(91,245,154,0.8)';x.shadowBlur=12;
    x.fillStyle='rgba(150,255,200,0.65)';x.fillRect(WINX+PADX,yy-FS+5,12,FS+2);x.restore();
  }
  x.restore();

  hud(t);
  crt(t);
  powerOn(t);
}


window.seek=(ms)=>draw(ms/1000);
window.__dur=DUR;
console.log('DUR',DUR);
draw(0);
</script></body></html>
