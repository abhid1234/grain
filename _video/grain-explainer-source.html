<canvas id="c" width="1920" height="1080"></canvas>
<script>
const cv=document.getElementById('c'), x=cv.getContext('2d');
const W=1920,H=1080;
const INK='#eef2f7', MUT='#93a1b5', DIM='#5b6779';
const AMBER='#e0a441', GREEN='#5fc08a', BLUE='#6f9dea', RED='#e07070';
const SANS='-apple-system,"Segoe UI",Roboto,sans-serif';
const MONO='ui-monospace,Menlo,Monaco,monospace';

function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=(p)=>p<0?0:p>1?1:1-Math.pow(1-p,3);
// fade-in helper: progress of an element appearing at time `at` over `dur`
const fin=(t,at,dur=0.5)=>ease((t-at)/dur);

function bg(){
  let g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#101722');g.addColorStop(0.5,'#0c1119');g.addColorStop(1,'#0a0e14');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(W*0.85,H*0.1,0,W*0.85,H*0.1,700);
  g.addColorStop(0,'rgba(224,164,65,0.10)');g.addColorStop(1,'rgba(224,164,65,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(W*0.1,H*0.95,0,W*0.1,H*0.95,700);
  g.addColorStop(0,'rgba(111,157,234,0.09)');g.addColorStop(1,'rgba(111,157,234,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
}
function card(px,py,w,h,{a=1,accent=null,fill='rgba(255,255,255,0.045)'}={}){
  x.save();x.globalAlpha*=a;
  x.shadowColor='rgba(0,0,0,0.4)';x.shadowBlur=30;x.shadowOffsetY=12;
  rr(px,py,w,h,16);x.fillStyle=fill;x.fill();x.shadowColor='transparent';
  rr(px,py,w,h,16);x.lineWidth=1.4;x.strokeStyle=accent||'rgba(255,255,255,0.13)';x.stroke();
  x.restore();
}
function text(s,px,py,{size=30,color=INK,font=SANS,weight=500,align='left',a=1}={}){
  x.save();x.globalAlpha*=a;x.fillStyle=color;x.textAlign=align;x.textBaseline='alphabetic';
  x.font=`${weight} ${size}px ${font}`;x.fillText(s,px,py);x.restore();
}
function wrap(s,px,py,maxw,{size=30,color=MUT,lh=42,align='left',a=1,weight=500,font=SANS}={}){
  x.save();x.font=`${weight} ${size}px ${font}`;
  const words=String(s).split(' ');let line='',yy=py;
  for(const w of words){const t=line?line+' '+w:w;
    if(x.measureText(t).width>maxw&&line){text(line,px,yy,{size,color,align,a,weight,font});line=w;yy+=lh;}
    else line=t;}
  if(line)text(line,px,yy,{size,color,align,a,weight,font});
  x.restore();return yy+lh;
}
function eyebrow(s,px,py,{a=1,color=AMBER}={}){
  x.save();x.globalAlpha*=a;x.fillStyle=color;x.textAlign='left';
  x.font=`700 20px ${MONO}`;x.fillText(s.split('').join(' ').toUpperCase(),px,py);x.restore();
}
// terminal window
function term(px,py,w,h,title,{a=1}={}){
  x.save();x.globalAlpha*=a;
  x.shadowColor='rgba(0,0,0,0.55)';x.shadowBlur=44;x.shadowOffsetY=18;
  rr(px,py,w,h,14);x.fillStyle='#0a0d13';x.fill();x.shadowColor='transparent';
  rr(px,py,w,h,14);x.lineWidth=1.4;x.strokeStyle='rgba(255,255,255,0.12)';x.stroke();
  // title bar
  x.save();rr(px,py,w,46,14);x.clip();x.fillStyle='rgba(255,255,255,0.05)';x.fillRect(px,py,w,46);x.restore();
  const dots=[['#ff5f57',0],['#febc2e',1],['#28c840',2]];
  for(const [c,i] of dots){x.beginPath();x.arc(px+26+i*22,py+23,6.5,0,7);x.fillStyle=c;x.fill();}
  text(title,px+w/2,py+30,{size:18,color:DIM,font:MONO,align:'center'});
  x.restore();
}
// typed lines inside a terminal; each entry {t:'text',c:color,i:indent}
function termLines(lines,px,py,{a=1,size=23,lh=34}={}){
  let yy=py;
  for(const L of lines){
    if(L.t!=='') text(L.t,px+(L.i||0),yy,{size,color:L.c||INK,font:MONO,a:a*(L.a??1),weight:L.w||500});
    yy+=(L.lh||lh);
  }
  return yy;
}
function arrow(x1,y1,x2,y2,{a=1,color=DIM,width=2.5,head=12}={}){
  x.save();x.globalAlpha*=a;x.strokeStyle=color;x.fillStyle=color;x.lineWidth=width;
  x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
  const ang=Math.atan2(y2-y1,x2-x1);
  x.beginPath();x.moveTo(x2,y2);
  x.lineTo(x2-head*Math.cos(ang-0.4),y2-head*Math.sin(ang-0.4));
  x.lineTo(x2-head*Math.cos(ang+0.4),y2-head*Math.sin(ang+0.4));
  x.closePath();x.fill();x.restore();
}
function grainMark(cx,cy,s,{a=1}={}){
  x.save();x.globalAlpha*=a;x.translate(cx,cy);
  const g=x.createRadialGradient(0,0,0,0,0,s*1.4);
  g.addColorStop(0,'rgba(224,164,65,0.25)');g.addColorStop(1,'rgba(224,164,65,0)');
  x.fillStyle=g;x.fillRect(-s*1.5,-s*1.5,s*3,s*3);
  // wheat stalk
  x.strokeStyle=AMBER;x.lineWidth=s*0.09;x.lineCap='round';
  x.beginPath();x.moveTo(0,s*0.55);x.lineTo(0,-s*0.5);x.stroke();
  for(let i=0;i<4;i++){
    const yy=-s*0.42+i*s*0.24;
    x.beginPath();x.moveTo(0,yy+s*0.12);x.quadraticCurveTo(-s*0.34,yy+s*0.02,-s*0.30,yy-s*0.16);x.stroke();
    x.beginPath();x.moveTo(0,yy+s*0.12);x.quadraticCurveTo(s*0.34,yy+s*0.02,s*0.30,yy-s*0.16);x.stroke();
  }
  x.restore();
}
